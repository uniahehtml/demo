
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Register</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 22px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    color: white;
    animation: appear 0.6s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    font-size: 38px;
    margin-bottom: 10px;
}

h2 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #c6c4df;
    font-size: 14px;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #e1defb;
}

.input-group input {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.07);
    color: white;
    font-size: 15px;
    transition: 0.3s;
}

.input-group input::placeholder {
    color: #aaa7c7;
}

.input-group input:focus {
    border-color: #a78bfa;
    box-shadow: 0 0 12px rgba(167,139,250,0.25);
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin: 4px 0 20px;
    color: #ddd9f5;
    gap: 8px;
}

.options a, .switch a {
    color: #c4b5fd;
    text-decoration: none;
    cursor: pointer;
}

.options a:hover, .switch a:hover {
    text-decoration: underline;
}

.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124,58,237,0.4);
}

.switch {
    text-align: center;
    margin-top: 23px;
    color: #d0cde8;
    font-size: 14px;
}

.hidden {
    display: none;
}

.message {
    text-align: center;
    font-size: 13px;
    margin-top: 12px;
    color: #ddd6fe;
}

@media (max-width: 480px) {
    .container {
        padding: 25px 20px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">✦</div>

    <!-- Login Form -->
    <form id="loginForm">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue your journey</p>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password"
                   minlength="8" required>
        </div>

        <div class="options">
            <label><input type="checkbox"> Remember me</label>
            <a href="#" id="forgotLink">Forgot Password?</a>
        </div>

        <button class="btn" type="submit">Login</button>

        <p class="switch">
            Don't have an account?
            <a href="#" id="showRegister">Register</a>
        </p>
    </form>

    <!-- Registration Form -->
    <form id="registerForm" class="hidden">
        <h2>Create Account</h2>
        <p class="subtitle">Join us and get started today</p>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password"
                   minlength="8" required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password"
                   minlength="8" required>
        </div>

        <button class="btn" type="submit">Create Account</button>

        <p class="switch">
            Already have an account?
            <a href="#" id="showLogin">Login</a>
        </p>
    </form>

    <p class="message" id="message" aria-live="polite"></p>
</div>

<script>
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const message = document.getElementById("message");

document.getElementById("showRegister").onclick = function(e) {
    e.preventDefault();
    loginForm.classList.add("hidden");
    registerForm.classList.remove("hidden");
    message.textContent = "";
};

document.getElementById("showLogin").onclick = function(e) {
    e.preventDefault();
    registerForm.classList.add("hidden");
    loginForm.classList.remove("hidden");
    message.textContent = "";
};

loginForm.onsubmit = function(e) {
    e.preventDefault();
    message.textContent =
        "Demo only: connect a backend to log in securely.";
};

registerForm.onsubmit = function(e) {
    e.preventDefault();

    const password = registerForm.querySelector(
        'input[placeholder="Create a password"]'
    ).value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match!";
        return;
    }

    message.textContent =
        "Demo only: connect a backend to create your account.";
};

document.getElementById("forgotLink").onclick = function(e) {
    e.preventDefault();
    message.textContent =
        "Password reset ke liye backend setup zaroori hai.";
};
</script>

</body>
</html>
